[project]
name = "football-predictor"
version = "0.1.0"
description = "Modular football match outcome prediction system."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
data = [
    "soccerdata>=1.8",
    "statsbombpy>=1.0",
]
ml = [
    "lightgbm>=4.0",
    "catboost>=1.2",
]
bayesian = [
    "pymc>=5.0",
]
test = [
    "pytest>=7.0",
    "pytest-mock",
    "coverage>=7.0",
]
dev = [
    "football-predictor[data,ml,bayesian,test]",
    "mypy",
    "tox",
    "black",
    "flake8",
]

[project.scripts]
football-predict = "football_predictor.predict:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]
namespaces = false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
