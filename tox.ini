[tox]
envlist = py39,py310,py311,check-formatting,lint,mypy
skipsdist = True
usedevelop = True
requires =
    setuptools>=68
    pip>=24

[testenv]
deps = -e .[test]
commands =
    pytest tests {posargs}
setenv =
    SOURCE = {toxinidir}/football_predictor
    TEST_SOURCE = {toxinidir}/tests
    LINE_LENGTH = 120

[testenv:check-formatting]
basepython = python3.11
deps = black
skip_install = true
commands =
    black {env:SOURCE} tests --line-length {env:LINE_LENGTH} --diff --check

[testenv:format]
basepython = python3.11
deps = black
skip_install = true
commands =
    black {env:SOURCE} tests --line-length {env:LINE_LENGTH}

[testenv:lint]
basepython = python3.11
deps = flake8
skip_install = true
commands = flake8

[testenv:mypy]
basepython = python3.11
deps = mypy
commands = mypy football_predictor tests --strict --ignore-missing-imports --allow-subclassing-any

[flake8]
show-source = true
max-line-length = 120
exclude = .venv,.tox,.git,dist,doc,*.egg,build
ignore = E203,E731,W503,E231
per-file-ignores = __init__.py:F401

[pytest]
addopts = -v
testpaths = tests
